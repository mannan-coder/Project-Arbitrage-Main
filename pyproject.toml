[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-improver"
version = "0.1.0"
description = "Non-destructive multi-agent code improvement system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "output*", "tests*"]